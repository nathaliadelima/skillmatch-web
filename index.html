<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema para verificar compatibilidade entre candidatos e vagas de emprego">
    <title>Compatibilidade de Vagas</title>
    <link rel="stylesheet" href="assets/styles/index.styles.css">
</head>
<body>

    <header>

    <h1>SkillMatch</h1>

    <p>
        Descubra quais vagas combinam com o seu perfil
        e veja quais habilidades desenvolver.
    </p>

    </header>

   <main>

    <section class="perfil">
        <h2>Perfil do candidato</h2>

        <form id="form-candidato">

            <div class="campo">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="campo">
                <label for="area">Área</label>

                <select id="area" required>
                    <option value="">Selecione</option>
                    <option value="Front-end">Front-end</option>
                    <option value="Back-end">Back-end</option>
                    <option value="Full Stack">Full Stack</option>
                </select>
            </div>

            <div class="campo">
                <label for="habilidades">
                    Habilidades
                </label>

                <textarea
                    id="habilidades"
                    rows="4"
                    placeholder="Ex.: HTML, CSS, JavaScript"
                    required
                ></textarea>
            </div>

            <div class="campo">
                <label for="experiencia">
                    Experiência (meses)
                </label>

                <input
                    type="number"
                    id="experiencia"
                    min="0"
                    value="0"
                >
            </div>

            <button type="submit">
                Analisar Perfil
            </button>

        </form>

    <section class="resultados">

    <h2>Resultado da análise</h2>

    <div id="lista-vagas"></div>

    </section>    

    </section>

    <section class="resultados">

        <h2>Resultado da análise</h2>

        <div id="lista-vagas"></div>

    </section>

</main>

    <footer>
        <p>Projeto avaliativo - Módulo Front-End</p>
    </footer>

    <script type="module" src="assets/scripts/main.js"></script>
</body>
</html>
