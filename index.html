<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema para verificar compatibilidade entre candidatos e vagas de emprego">
    <title>Compatibilidade de Vagas</title>
    <link rel="stylesheet" href="assets/styles/index.styles.css">
</head>
<body>

    <header>
        <h1>Compatibilidade de Vagas</h1>
    </header>

    <main>

        <section id="formulario">
            <h2>Preencha seus dados</h2>

            <form>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome">

                <label for="area">Área</label>
                <input type="text" id="area" name="area">

                <label for="habilidades">Habilidades</label>
                <input type="text" id="habilidades" name="habilidades">

                <label for="experiencia">Experiência</label>
                <input type="text" id="experiencia" name="experiencia">

                <button type="submit">Verificar</button>
            </form>
        </section>

        <section id="resultados">
            <h2>Resultados</h2>
        </section>

    </main>

    <footer>
        <p>Projeto avaliativo - Módulo Front-End</p>
    </footer>

    <script type="module" src="assets/scripts/main.js"></script>
</body>
</html>
